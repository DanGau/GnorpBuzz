<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GnorpBuzz</title>
    <style>
      html, body { margin: 0; padding: 0; background: #111; height: 100%; overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #f0e9d2; }
      #app { width: 100vw; height: 100vh; position: relative; }
      #ui { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
      #ui .panel { pointer-events: auto; }

      .resource-bar {
        position: absolute; top: 16px; left: 16px;
        background: rgba(20, 14, 6, 0.7); padding: 10px 16px;
        border-radius: 8px; backdrop-filter: blur(4px);
        font-size: 18px; font-weight: 600;
        display: flex; align-items: center; gap: 8px;
      }
      .resource-bar .icon { font-size: 22px; }

      /* Per-hive control panel anchored above each hive in world space.
         Header is always visible; body collapses smoothly on click. */
      .hive-control {
        position: absolute;
        transform: translate(-50%, -100%);
        background: rgba(20, 14, 6, 0.78);
        border-radius: 10px;
        backdrop-filter: blur(4px);
        min-width: 160px;
        max-width: 200px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        margin-top: -8px;
        overflow: hidden;
        transition: box-shadow 200ms ease;
      }
      .hive-control:hover { box-shadow: 0 6px 22px rgba(0, 0, 0, 0.5); }
      .hive-control .header {
        all: unset;
        display: flex; align-items: center; gap: 8px;
        width: 100%; box-sizing: border-box;
        padding: 8px 12px;
        cursor: pointer;
        color: #f0e9d2;
        font-size: 13px; font-weight: 600;
        letter-spacing: 0.02em;
      }
      .hive-control .header:hover { background: rgba(255, 220, 100, 0.06); }
      .hive-control .header .title { flex: 1; }
      .hive-control .header .count-badge {
        background: rgba(245, 209, 102, 0.2);
        color: #f5d166;
        padding: 2px 8px; border-radius: 999px;
        font-size: 12px; font-weight: 700;
        min-width: 18px; text-align: center;
      }
      .hive-control .header .chevron {
        color: #b9a466; font-size: 11px;
        transition: transform 200ms ease;
      }
      .hive-control.collapsed .header .chevron { transform: rotate(-90deg); }
      .hive-control .body {
        padding: 0 12px 10px;
        max-height: 100px;
        opacity: 1;
        transition: max-height 220ms ease, opacity 180ms ease, padding 220ms ease;
        overflow: hidden;
      }
      .hive-control.collapsed .body {
        max-height: 0;
        opacity: 0;
        padding-top: 0; padding-bottom: 0;
      }
      .hive-control .cost-row {
        font-size: 12px; color: #cfc6a8;
        margin-bottom: 6px;
      }
      .hive-control .cost-row .cost-num { color: #f5d166; font-weight: 600; }
      .hive-control .build {
        all: unset;
        display: block; width: 100%;
        box-sizing: border-box;
        padding: 7px 10px;
        background: #d49a36; color: #2a1f0a; font-weight: 600;
        border-radius: 6px; cursor: pointer; font-size: 13px;
        text-align: center;
        transition: background 120ms ease;
      }
      .hive-control .build:hover:not(:disabled) { background: #e8b04c; }
      .hive-control .build:disabled {
        background: #5a4a30; color: #8a7a55; cursor: not-allowed;
      }
      /* Subtle role-tinted accents */
      .hive-control.hive-forager .header .count-badge { background: rgba(245, 209, 102, 0.25); }
      .hive-control.hive-wax .header .count-badge {
        background: rgba(212, 168, 106, 0.25); color: #d4a86a;
      }

      .vessel-progress {
        position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
        background: rgba(20, 14, 6, 0.7); padding: 10px 16px;
        border-radius: 8px; backdrop-filter: blur(4px);
        min-width: 320px; text-align: center;
      }
      .vessel-progress .label { font-size: 12px; opacity: 0.8; margin-bottom: 6px; }
      .vessel-progress .bar { height: 12px; background: #2a1f0a; border-radius: 6px; overflow: hidden; }
      .vessel-progress .fill { height: 100%; background: #f5d166; transition: width 100ms linear; }
      .vessel-progress .status { font-size: 13px; margin-top: 4px; }
      .vessel-progress.ready { background: rgba(80, 60, 20, 0.85); box-shadow: 0 0 24px rgba(255, 220, 100, 0.6); }
      .vessel-progress.ready .status { color: #fff2cf; font-weight: 600; }
      .vessel-progress.ready .fill { background: #fff2cf; }

      .journal-modal {
        position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6);
        display: flex; align-items: center; justify-content: center;
        backdrop-filter: blur(2px);
      }
      .journal-modal .card {
        background: #f5e9c8; color: #2a1f0a;
        max-width: 480px; padding: 32px 36px;
        border-radius: 10px; box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
        font-family: 'Georgia', serif;
      }
      .journal-modal h2 { margin: 0 0 12px; font-size: 18px; letter-spacing: 0.05em;
        text-transform: uppercase; color: #6e5b2a; }
      .journal-modal p { margin: 0 0 20px; font-size: 18px; line-height: 1.5; font-style: italic; }
      .journal-modal .signature { font-size: 13px; color: #6e5b2a; margin-bottom: 20px; }
      .journal-modal button {
        background: #6e5b2a; color: #f5e9c8; border: none;
        padding: 10px 20px; border-radius: 6px; cursor: pointer;
        font-family: inherit; font-size: 14px; font-weight: 600;
      }

      .end-banner {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(20, 14, 6, 0.85); color: #f5d166;
        padding: 24px 36px; border-radius: 10px;
        font-size: 20px; text-align: center;
      }
      .end-banner small { display: block; font-size: 14px; color: #f0e9d2; margin-top: 6px; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
