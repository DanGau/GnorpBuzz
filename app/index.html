<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GnorpBuzz</title>
    <style>
      html, body { margin: 0; padding: 0; background: #111; height: 100%; overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #f0e9d2; }
      #app { width: 100vw; height: 100vh; position: relative; }
      #ui { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
      #ui .panel { pointer-events: auto; }

      .resource-bar {
        position: absolute; top: 16px; left: 16px;
        background: rgba(20, 14, 6, 0.7); padding: 10px 16px;
        border-radius: 8px; backdrop-filter: blur(4px);
        font-size: 18px; font-weight: 600;
        display: flex; align-items: center; gap: 8px;
      }
      .resource-bar .icon { font-size: 22px; }

      .buy-panel {
        position: absolute; top: 16px; right: 16px;
        background: rgba(20, 14, 6, 0.7); padding: 12px;
        border-radius: 8px; backdrop-filter: blur(4px);
        min-width: 180px;
      }
      .buy-panel button {
        width: 100%; margin-top: 6px; padding: 8px 12px;
        background: #d49a36; color: #2a1f0a; font-weight: 600;
        border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
      }
      .buy-panel button:disabled { background: #5a4a30; color: #8a7a55; cursor: not-allowed; }
      .buy-panel .label { font-size: 12px; opacity: 0.8; margin-bottom: 2px; }
      .buy-panel .cost { font-size: 14px; }

      .vessel-progress {
        position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
        background: rgba(20, 14, 6, 0.7); padding: 10px 16px;
        border-radius: 8px; backdrop-filter: blur(4px);
        min-width: 320px; text-align: center;
      }
      .vessel-progress .label { font-size: 12px; opacity: 0.8; margin-bottom: 6px; }
      .vessel-progress .bar { height: 12px; background: #2a1f0a; border-radius: 6px; overflow: hidden; }
      .vessel-progress .fill { height: 100%; background: #f5d166; transition: width 100ms linear; }
      .vessel-progress .status { font-size: 13px; margin-top: 4px; }
      .vessel-progress.ready { background: rgba(80, 60, 20, 0.85); box-shadow: 0 0 24px rgba(255, 220, 100, 0.6); }
      .vessel-progress.ready .status { color: #fff2cf; font-weight: 600; }
      .vessel-progress.ready .fill { background: #fff2cf; }

      .journal-modal {
        position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6);
        display: flex; align-items: center; justify-content: center;
        backdrop-filter: blur(2px);
      }
      .journal-modal .card {
        background: #f5e9c8; color: #2a1f0a;
        max-width: 480px; padding: 32px 36px;
        border-radius: 10px; box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
        font-family: 'Georgia', serif;
      }
      .journal-modal h2 { margin: 0 0 12px; font-size: 18px; letter-spacing: 0.05em;
        text-transform: uppercase; color: #6e5b2a; }
      .journal-modal p { margin: 0 0 20px; font-size: 18px; line-height: 1.5; font-style: italic; }
      .journal-modal .signature { font-size: 13px; color: #6e5b2a; margin-bottom: 20px; }
      .journal-modal button {
        background: #6e5b2a; color: #f5e9c8; border: none;
        padding: 10px 20px; border-radius: 6px; cursor: pointer;
        font-family: inherit; font-size: 14px; font-weight: 600;
      }

      .end-banner {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(20, 14, 6, 0.85); color: #f5d166;
        padding: 24px 36px; border-radius: 10px;
        font-size: 20px; text-align: center;
      }
      .end-banner small { display: block; font-size: 14px; color: #f0e9d2; margin-top: 6px; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
