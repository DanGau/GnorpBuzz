<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GnorpBuzz</title>
    <style>
      html, body { margin: 0; padding: 0; background: #111; height: 100%; overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #f0e9d2; }
      #app { width: 100vw; height: 100vh; position: relative; }
      #ui { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
      #ui .panel { pointer-events: auto; }

      .resource-bar {
        position: absolute; top: 16px; left: 16px;
        background: rgba(20, 14, 6, 0.7); padding: 10px 16px;
        border-radius: 8px; backdrop-filter: blur(4px);
        font-size: 18px; font-weight: 600;
        display: flex; align-items: center; gap: 8px;
      }
      .resource-bar .icon { font-size: 22px; }

      /* Per-hive control panel — anchored above its hive, hidden until the
         player clicks the building. Sits with its bottom 12px above the
         anchor point, with a small downward caret pointing at the building. */
      .hive-control {
        position: absolute;
        transform: translate(-50%, -100%);
        margin-top: -12px;
        background: rgba(20, 14, 6, 0.86);
        border-radius: 10px;
        backdrop-filter: blur(6px);
        min-width: 168px;
        max-width: 200px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        opacity: 1;
        transition:
          opacity 180ms ease,
          transform 220ms cubic-bezier(0.2, 0.9, 0.3, 1.2);
        pointer-events: auto;
      }
      .hive-control.hidden {
        opacity: 0;
        transform: translate(-50%, calc(-100% + 8px)) scale(0.92);
        pointer-events: none;
      }
      .hive-control .header {
        display: flex; align-items: center; gap: 8px;
        padding: 9px 12px 6px;
        color: #f0e9d2;
        font-size: 13px; font-weight: 600;
        letter-spacing: 0.02em;
      }
      .hive-control .header .title { flex: 1; }
      .hive-control .header .count-badge {
        background: rgba(245, 209, 102, 0.22);
        color: #f5d166;
        padding: 2px 9px; border-radius: 999px;
        font-size: 12px; font-weight: 700;
        min-width: 18px; text-align: center;
      }
      .hive-control .body {
        padding: 0 12px 10px;
      }
      .hive-control .cost-row {
        font-size: 12px; color: #cfc6a8;
        margin-bottom: 6px;
      }
      .hive-control .cost-row .cost-num { color: #f5d166; font-weight: 600; }
      .hive-control .build {
        display: block; width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        background: #d49a36; color: #2a1f0a; font-weight: 600;
        border: none; border-radius: 6px; cursor: pointer; font-size: 13px;
        text-align: center;
        transition: background 120ms ease;
      }
      .hive-control .build:hover:not(:disabled) { background: #e8b04c; }
      .hive-control .build:disabled {
        background: #5a4a30; color: #8a7a55; cursor: not-allowed;
      }
      /* Down-pointing caret connecting panel to building */
      .hive-control .caret {
        position: absolute;
        left: 50%; bottom: -7px;
        transform: translateX(-50%);
        width: 0; height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-top: 8px solid rgba(20, 14, 6, 0.86);
      }
      .hive-control.hive-wax .header .count-badge {
        background: rgba(212, 168, 106, 0.25); color: #d4a86a;
      }
      .hive-control.hive-builder .header .count-badge {
        background: rgba(224, 122, 58, 0.28); color: #f0a070;
      }
      .hive-control { min-width: 220px; max-width: 260px; }
      .hive-control .upgrade-list {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid rgba(245, 209, 102, 0.18);
        display: flex; flex-direction: column; gap: 6px;
      }
      .hive-control .upgrade-row {
        display: flex; align-items: center; gap: 8px;
        font-size: 11px;
      }
      .hive-control .upgrade-row .up-info { flex: 1; min-width: 0; }
      .hive-control .upgrade-row .up-name {
        color: #f0e9d2; font-weight: 600;
      }
      .hive-control .upgrade-row .up-blurb {
        color: #9a9078; font-size: 10px;
      }
      .hive-control .upgrade-row .up-action {
        display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
      }
      .hive-control .upgrade-row .up-tier {
        color: #b9a466; font-size: 10px; letter-spacing: 0.05em;
      }
      .hive-control .upgrade-row .up-btn {
        background: #5a4a30; color: #f0e9d2;
        border: none; border-radius: 4px;
        padding: 3px 8px; font-size: 10px; font-weight: 600;
        cursor: pointer;
        min-width: 56px; text-align: center;
      }
      .hive-control .upgrade-row .up-btn:hover:not(:disabled) {
        background: #6e5a3a;
      }
      .hive-control .upgrade-row .up-btn:disabled {
        background: #3a2f1d; color: #6e6450; cursor: not-allowed;
      }
      .hive-control .upgrade-row.locked .up-name { color: #7a7460; }
      .hive-control .upgrade-row.locked .up-blurb { color: #5a5448; }
      .hive-control .upgrade-row.locked { opacity: 0.7; }

      /* Launch button — anchored next to the airplane in world space. */
      .launch-anchor {
        position: absolute;
        transform: translate(-50%, 0);
        pointer-events: auto;
        opacity: 1;
        transition: opacity 200ms ease, transform 220ms cubic-bezier(0.2, 0.9, 0.3, 1.2);
      }
      .launch-anchor.hidden {
        opacity: 0;
        transform: translate(-50%, -8px) scale(0.92);
        pointer-events: none;
      }
      .launch-anchor .launch-btn {
        background: #f5d166; color: #2a1f0a;
        font-weight: 700; font-size: 14px; letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 10px 22px;
        border: none; border-radius: 999px;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(255, 220, 100, 0.45), 0 2px 8px rgba(0, 0, 0, 0.4);
        animation: launch-pulse 1.5s ease-in-out infinite;
      }
      .launch-anchor .launch-btn:hover {
        background: #ffe680;
        transform: translateY(-1px);
      }
      @keyframes launch-pulse {
        0%, 100% { box-shadow: 0 6px 20px rgba(255, 220, 100, 0.45), 0 2px 8px rgba(0, 0, 0, 0.4); }
        50% { box-shadow: 0 6px 28px rgba(255, 220, 100, 0.7), 0 2px 8px rgba(0, 0, 0, 0.4); }
      }

      /* Anchored above the airplane in world space; visible only when the
         vessel is selected. Mirrors hive-control panel styling. */
      .vessel-progress {
        position: absolute;
        transform: translate(-50%, -100%);
        margin-top: -12px;
        background: rgba(20, 14, 6, 0.86);
        border-radius: 10px;
        backdrop-filter: blur(6px);
        min-width: 160px; max-width: 200px;
        padding: 9px 12px 10px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        opacity: 1;
        transition:
          opacity 180ms ease,
          transform 220ms cubic-bezier(0.2, 0.9, 0.3, 1.2);
        pointer-events: auto;
      }
      .vessel-progress.hidden {
        opacity: 0;
        transform: translate(-50%, calc(-100% + 8px)) scale(0.92);
        pointer-events: none;
      }
      .vessel-progress .title {
        color: #f0e9d2; font-size: 13px; font-weight: 600;
        letter-spacing: 0.02em; margin-bottom: 4px;
      }
      .vessel-progress .status {
        color: #cfc6a8; font-size: 12px; margin-bottom: 6px;
      }
      .vessel-progress .bar {
        height: 6px; background: #2a1f0a; border-radius: 4px; overflow: hidden;
      }
      .vessel-progress .fill {
        height: 100%; background: #f5d166;
        transition: width 100ms linear;
      }
      .vessel-progress .caret {
        position: absolute;
        left: 50%; bottom: -7px;
        transform: translateX(-50%);
        width: 0; height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-top: 8px solid rgba(20, 14, 6, 0.86);
      }

      .journal-modal {
        position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6);
        display: flex; align-items: center; justify-content: center;
        backdrop-filter: blur(2px);
      }
      .journal-modal .card {
        background: #f5e9c8; color: #2a1f0a;
        max-width: 480px; padding: 32px 36px;
        border-radius: 10px; box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
        font-family: 'Georgia', serif;
      }
      .journal-modal h2 { margin: 0 0 12px; font-size: 18px; letter-spacing: 0.05em;
        text-transform: uppercase; color: #6e5b2a; }
      .journal-modal p { margin: 0 0 20px; font-size: 18px; line-height: 1.5; font-style: italic; }
      .journal-modal .signature { font-size: 13px; color: #6e5b2a; margin-bottom: 20px; }
      .journal-modal button {
        background: #6e5b2a; color: #f5e9c8; border: none;
        padding: 10px 20px; border-radius: 6px; cursor: pointer;
        font-family: inherit; font-size: 14px; font-weight: 600;
      }

      .end-banner {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(20, 14, 6, 0.85); color: #f5d166;
        padding: 24px 36px; border-radius: 10px;
        font-size: 20px; text-align: center;
      }
      .end-banner small { display: block; font-size: 14px; color: #f0e9d2; margin-top: 6px; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
